<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWERA | FX Chart Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* ─── Header Bar ─── */
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Symbol Selector */
        .symbol-selector {
            position: relative;
        }

        .symbol-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            font-family: 'Outfit', monospace;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .symbol-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.5rem;
            z-index: 100;
            max-height: 400px;
            overflow-y: auto;
            width: 280px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .symbol-dropdown.open { display: block; }

        .symbol-dropdown-search {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 0.5rem;
        }

        .symbol-dropdown-search::placeholder { color: var(--text-secondary); }

        .symbol-group-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.5rem 0.5rem 0.25rem;
        }

        .symbol-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: background 0.15s;
        }

        .symbol-option:hover { background: rgba(59, 130, 246, 0.1); }
        .symbol-option.active { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }

        .symbol-option .pair-label { font-family: monospace; }

        /* Price Info */
        .price-info {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
        }

        .current-price {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: monospace;
        }

        .price-change {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .price-change.positive { color: var(--accent-green); }
        .price-change.negative { color: var(--accent-red); }

        /* Live Indicator */
        .live-badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .live-text {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
        }

        .last-update {
            font-size: 0.65rem;
            font-family: monospace;
            color: var(--text-secondary);
        }

        /* Timeframe Buttons */
        .header-center {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tf-group {
            display: flex;
            gap: 0.25rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.35rem 1rem;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .tf-btn:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .tf-btn.active { color: white; background: var(--accent-blue); box-shadow: 0 0 12px rgba(59, 130, 246, 0.3); }

        /* Overlay Legend */
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .overlay-legend {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.7rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-secondary);
        }

        .legend-line {
            width: 14px;
            height: 2px;
            display: inline-block;
            border-radius: 1px;
        }

        .legend-value {
            font-weight: 600;
            font-family: monospace;
        }

        /* ─── Chart Container ─── */
        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #chartContainer {
            width: 100%;
            height: 100%;
        }

        /* ─── Loading Overlay ─── */
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 23, 0.85);
            z-index: 50;
            backdrop-filter: blur(4px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="chart-header">
        <div class="header-left">
            <span class="logo-text">NEWERA</span>

            <!-- Symbol Selector -->
            <div class="symbol-selector" id="symbolSelector">
                <button class="symbol-btn" id="symbolBtn" onclick="toggleSymbolDropdown()">
                    <span id="symbolLabel">EUR/USD</span>
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3.5L5 6.5L8 3.5"/></svg>
                </button>
                <div class="symbol-dropdown" id="symbolDropdown">
                    <input type="text" class="symbol-dropdown-search" id="symbolSearch" placeholder="Search pair..." oninput="filterSymbols(this.value)">
                    <div id="symbolList"></div>
                </div>
            </div>

            <!-- Price Info -->
            <div class="price-info">
                <span class="current-price" id="currentPrice">-</span>
                <span class="price-change" id="priceChange">-</span>
            </div>

            <!-- Live Badge -->
            <div class="live-badge">
                <div class="live-dot"></div>
                <span class="live-text">DB</span>
            </div>
            <span class="last-update" id="lastUpdate">-</span>
        </div>

        <!-- Timeframe Buttons -->
        <div class="header-center">
            <div class="tf-group" id="tfGroup">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Overlay Legend -->
        <div class="header-right">
            <div class="overlay-legend">
                <div class="legend-item">
                    <span class="legend-line" style="background: #f59e0b;"></span>
                    EMA 20
                    <span class="legend-value" id="ema20Val" style="color: #f59e0b;">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #3b82f6;"></span>
                    EMA 50
                    <span class="legend-value" id="ema50Val" style="color: #3b82f6;">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #a855f7;"></span>
                    EMA 200
                    <span class="legend-value" id="ema200Val" style="color: #a855f7;">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line" id="stLegendLine" style="background: #10b981;"></span>
                    SuperTrend
                    <span class="legend-value" id="stVal" style="color: #10b981;">-</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #22c55e80;"></span>
                    S/R
                    <span class="legend-value" id="srVal" style="color: #9ca3af;">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart Area -->
    <div class="chart-wrapper">
        <div id="chartContainer"></div>
        <div class="loading-overlay" id="loadingOverlay">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading chart data...</div>
            </div>
        </div>
    </div>

    <script>
        // ─── Constants ─────────────────────────────────────────────
        const PAIRS = {
            "Majors": [
                "EUR/USD", "USD/JPY", "GBP/USD", "USD/CHF",
                "AUD/USD", "USD/CAD", "NZD/USD"
            ],
            "Metals": ["XAU/USD"],
            "Crosses": [
                "EUR/GBP", "EUR/CHF", "EUR/JPY", "EUR/AUD", "EUR/CAD", "EUR/NZD",
                "GBP/JPY", "GBP/AUD", "GBP/CAD", "GBP/CHF", "GBP/NZD",
                "CHF/JPY", "CAD/JPY", "AUD/JPY", "NZD/JPY",
                "AUD/CHF", "AUD/CAD", "AUD/NZD", "CAD/CHF", "NZD/CHF"
            ]
        };

        const TIMEFRAMES = [
            { label: "1H", value: "H1" }
        ];

        // ─── State ─────────────────────────────────────────────────
        let currentSymbol = "EUR/USD";
        let currentTimeframe = "H1";
        let chart = null;
        let candleSeries = null;
        let volumeSeries = null;
        let ema20Series = null;
        let ema50Series = null;
        let ema200Series = null;
        let supertrendSeries = null;
        let priceLines = [];  // Support & Resistance price lines
        let rawCandles = [];

        // Note: All indicator calculations (EMA 20/50/200, SuperTrend, Support/Resistance) have been shifted to the backend Python API.

        // ─── Format Price ──────────────────────────────────────────
        function formatPrice(val, symbol) {
            if (typeof val !== 'number' || isNaN(val)) return '-';
            const sym = (symbol || currentSymbol).toUpperCase().replace("/", "");
            if (sym.endsWith("JPY")) return val.toFixed(3);
            if (sym.includes("XAU") || sym.includes("GOLD")) return val.toFixed(2);
            return val.toFixed(5);
        }

        // ─── Initialize Chart ──────────────────────────────────────
        function initChart() {
            const container = document.getElementById('chartContainer');
            const rect = container.getBoundingClientRect();
            
            chart = LightweightCharts.createChart(container, {
                width: rect.width,
                height: rect.height,
                layout: {
                    background: { type: 'solid', color: 'transparent' },
                    textColor: '#9ca3af',
                    fontSize: 12,
                    fontFamily: "'Outfit', sans-serif",
                    attributionLogo: false,
                },
                grid: {
                    vertLines: { color: 'rgba(128, 128, 128, 0.08)' },
                    horzLines: { color: 'rgba(128, 128, 128, 0.08)' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { color: '#3b82f680', width: 1, labelBackgroundColor: '#1e40af' },
                    horzLine: { color: '#3b82f680', width: 1, labelBackgroundColor: '#1e40af' },
                },
                timeScale: {
                    borderColor: '#1f2937',
                    timeVisible: true,
                    secondsVisible: false,
                    rightOffset: 8,
                    barSpacing: 10,
                    minBarSpacing: 4,
                },
                rightPriceScale: {
                    borderColor: '#1f2937',
                    scaleMargins: { top: 0.05, bottom: 0.2 },
                },
                handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
                handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true },
            });

            // Candlestick Series
            candleSeries = chart.addCandlestickSeries({
                upColor: '#22c55e',
                downColor: '#ef4444',
                borderUpColor: '#22c55e',
                borderDownColor: '#ef4444',
                wickUpColor: '#22c55e80',
                wickDownColor: '#ef444480',
            });

            // Volume Histogram
            volumeSeries = chart.addHistogramSeries({
                priceFormat: { type: 'volume' },
                priceScaleId: 'volume',
            });
            chart.priceScale('volume').applyOptions({
                scaleMargins: { top: 0.85, bottom: 0 },
            });

            // EMA 20 Line
            ema20Series = chart.addLineSeries({
                color: '#f59e0b',
                lineWidth: 1,
                title: '',
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
            });

            // EMA 50 Line
            ema50Series = chart.addLineSeries({
                color: '#3b82f6',
                lineWidth: 1,
                title: '',
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
            });

            // EMA 200 Line
            ema200Series = chart.addLineSeries({
                color: '#a855f7',
                lineWidth: 1,
                title: '',
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
            });

            // SuperTrend Line
            supertrendSeries = chart.addLineSeries({
                lineWidth: 2,
                title: '',
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
            });

            // Responsive resize
            window.addEventListener('resize', () => {
                const r = container.getBoundingClientRect();
                if (r.width > 0 && r.height > 0) {
                    chart.applyOptions({ width: r.width, height: r.height });
                }
            });
        }

        // ─── Fetch Data from DB API ────────────────────────────────
        async function fetchCandles(symbol, timeframe) {
            const dbSym = symbol.replace("/", "").toUpperCase();
            let baseUrl = window.location.origin;
            if (baseUrl.startsWith('file')) {
                baseUrl = 'http://localhost:3000';
            }
            const url = `${baseUrl}/api/v1/chart/candles?symbol=${dbSym}&timeframe=${timeframe}&limit=744&strategy_id=3e8d2b78-0e86-4fdf-9759-338276db1742`;

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                return data;
            } catch (err) {
                console.error("Failed to fetch candles:", err);
                return { candles: [], support: null, resistance: null };
            }
        }

        // ─── Load and Render ───────────────────────────────────────
        async function loadChart() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';

            const response = await fetchCandles(currentSymbol, currentTimeframe);
            const candles = response.candles || [];
            rawCandles = candles;

            if (candles.length === 0) {
                overlay.querySelector('.loading-text').textContent = 'No data available for this pair.';
                return;
            }

            // Parse candles — handle both ISO and Unix timestamp formats
            const candleData = [];
            const volumeData = [];

            candles.forEach(c => {
                let ts;
                if (typeof c.time === 'number') {
                    ts = c.time;
                } else {
                    // ISO string — parse to unix
                    ts = Math.floor(new Date(c.time).getTime() / 1000);
                }

                const o = parseFloat(c.open);
                const h = parseFloat(c.high);
                const l = parseFloat(c.low);
                const cl = parseFloat(c.close);
                const vol = parseInt(c.tick_volume || 0);

                candleData.push({ time: ts, open: o, high: h, low: l, close: cl });
                volumeData.push({
                    time: ts,
                    value: vol,
                    color: cl >= o ? '#22c55e25' : '#ef444425',
                });
            });

            // Set chart data
            candleSeries.setData(candleData);
            volumeSeries.setData(volumeData);

            // ── EMA 20, 50, 200 & SuperTrend ────────────────────────
            const ema20Aligned = [];
            const ema50Aligned = [];
            const ema200Aligned = [];
            const stData = [];

            candles.forEach((c, idx) => {
                const ts = candleData[idx].time;
                if (c.ema20 !== null && c.ema20 !== undefined) {
                    ema20Aligned.push({ time: ts, value: c.ema20 });
                }
                if (c.ema50 !== null && c.ema50 !== undefined) {
                    ema50Aligned.push({ time: ts, value: c.ema50 });
                }
                if (c.ema200 !== null && c.ema200 !== undefined) {
                    ema200Aligned.push({ time: ts, value: c.ema200 });
                }
                if (c.supertrend_value !== null && c.supertrend_value !== undefined) {
                    stData.push({
                        time: ts,
                        value: c.supertrend_value,
                        color: c.supertrend_direction === 1 ? '#10b981' : '#ef4444',
                    });
                }
            });

            ema20Series.setData(ema20Aligned);
            ema50Series.setData(ema50Aligned);
            ema200Series.setData(ema200Aligned);
            supertrendSeries.setData(stData);

            // ── Support & Resistance (Price Lines) ──────────────────
            // Remove old price lines
            priceLines.forEach(pl => {
                try { candleSeries.removePriceLine(pl); } catch(e) {}
            });
            priceLines = [];

            const supportVal = response.support;
            const resistanceVal = response.resistance;

            if (supportVal !== null && supportVal !== undefined) {
                const sLine = candleSeries.createPriceLine({
                    price: supportVal,
                    color: '#22c55e80',
                    lineWidth: 1,
                    lineStyle: 2,  // dashed
                    title: `S: ${formatPrice(supportVal, currentSymbol)}`,
                });
                priceLines.push(sLine);
            }

            if (resistanceVal !== null && resistanceVal !== undefined) {
                const rLine = candleSeries.createPriceLine({
                    price: resistanceVal,
                    color: '#ef444480',
                    lineWidth: 1,
                    lineStyle: 2,  // dashed
                    title: `R: ${formatPrice(resistanceVal, currentSymbol)}`,
                });
                priceLines.push(rLine);
            }

            // ── Update Header Info ──────────────────────────────────
            const lastCandle = candleData[candleData.length - 1];
            const prevCandle = candleData.length > 1 ? candleData[candleData.length - 2] : lastCandle;

            const price = lastCandle.close;
            const change = price - prevCandle.close;
            const changePct = prevCandle.close > 0 ? (change / prevCandle.close) * 100 : 0;

            document.getElementById('currentPrice').textContent = formatPrice(price, currentSymbol);
            const changeEl = document.getElementById('priceChange');
            const sign = change >= 0 ? '+' : '';
            const arrow = change >= 0 ? '↑' : '↓';
            changeEl.textContent = `${arrow} ${sign}${formatPrice(change, currentSymbol)} (${sign}${changePct.toFixed(2)}%)`;
            changeEl.className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;

            // EMA legend values
            document.getElementById('ema20Val').textContent = ema20Aligned.length > 0 ? formatPrice(ema20Aligned[ema20Aligned.length - 1].value, currentSymbol) : '-';
            document.getElementById('ema50Val').textContent = ema50Aligned.length > 0 ? formatPrice(ema50Aligned[ema50Aligned.length - 1].value, currentSymbol) : '-';
            document.getElementById('ema200Val').textContent = ema200Aligned.length > 0 ? formatPrice(ema200Aligned[ema200Aligned.length - 1].value, currentSymbol) : '-';

            // SuperTrend legend
            if (stData.length > 0) {
                const lastST = stData[stData.length - 1];
                const lastCandle = candles[candles.length - 1];
                const stColor = lastCandle.supertrend_direction === 1 ? '#10b981' : '#ef4444';
                document.getElementById('stVal').textContent = formatPrice(lastST.value, currentSymbol);
                document.getElementById('stVal').style.color = stColor;
                document.getElementById('stLegendLine').style.background = stColor;
            } else {
                document.getElementById('stVal').textContent = '-';
            }

            // S/R legend
            if (supportVal || resistanceVal) {
                const parts = [];
                if (supportVal) parts.push(`S:${formatPrice(supportVal, currentSymbol)}`);
                if (resistanceVal) parts.push(`R:${formatPrice(resistanceVal, currentSymbol)}`);
                document.getElementById('srVal').textContent = parts.join(' | ');
            } else {
                document.getElementById('srVal').textContent = '-';
            }

            // Update last update time
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('en-IN', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            }) + ' IST';

            // Fit content
            chart.timeScale().fitContent();

            // Hide loading
            overlay.style.display = 'none';
        }

        // ─── Symbol Dropdown ───────────────────────────────────────
        function buildSymbolList() {
            const list = document.getElementById('symbolList');
            list.innerHTML = '';

            for (const [group, pairs] of Object.entries(PAIRS)) {
                const groupLabel = document.createElement('div');
                groupLabel.className = 'symbol-group-label';
                groupLabel.textContent = group;
                list.appendChild(groupLabel);

                pairs.forEach(pair => {
                    const opt = document.createElement('div');
                    opt.className = 'symbol-option' + (pair === currentSymbol ? ' active' : '');
                    opt.setAttribute('data-pair', pair);
                    opt.innerHTML = `<span class="pair-label">${pair}</span>`;
                    opt.onclick = () => selectSymbol(pair);
                    list.appendChild(opt);
                });
            }
        }

        function toggleSymbolDropdown() {
            const dd = document.getElementById('symbolDropdown');
            dd.classList.toggle('open');
            if (dd.classList.contains('open')) {
                document.getElementById('symbolSearch').focus();
            }
        }

        function filterSymbols(query) {
            const q = query.toUpperCase();
            document.querySelectorAll('.symbol-option').forEach(opt => {
                const pair = opt.getAttribute('data-pair').toUpperCase();
                opt.style.display = pair.includes(q) ? '' : 'none';
            });
        }

        function selectSymbol(pair) {
            currentSymbol = pair;
            document.getElementById('symbolLabel').textContent = pair;
            document.getElementById('symbolDropdown').classList.remove('open');

            // Update active state
            document.querySelectorAll('.symbol-option').forEach(opt => {
                opt.classList.toggle('active', opt.getAttribute('data-pair') === pair);
            });

            loadChart();
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const selector = document.getElementById('symbolSelector');
            if (!selector.contains(e.target)) {
                document.getElementById('symbolDropdown').classList.remove('open');
            }
        });

        // ─── Timeframe Buttons ─────────────────────────────────────
        function buildTimeframeButtons() {
            const group = document.getElementById('tfGroup');
            group.innerHTML = '';

            TIMEFRAMES.forEach(tf => {
                const btn = document.createElement('button');
                btn.className = 'tf-btn' + (tf.value === currentTimeframe ? ' active' : '');
                btn.textContent = tf.label;
                btn.onclick = () => {
                    currentTimeframe = tf.value;
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadChart();
                };
                group.appendChild(btn);
            });
        }

        // ─── Init ──────────────────────────────────────────────────
        function init() {
            initChart();
            buildSymbolList();
            buildTimeframeButtons();
            loadChart();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
